<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chọn pet</title>
<link rel="stylesheet" href="css/ui.css">
<style>
  body {
    user-select: none;
  }

  #wrap {
    padding: 22px 20px 18px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 15px;
    margin: 0 0 18px;
    text-align: center;
  }

  #cards {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .card {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: background 0.1s, border-color 0.1s;
  }

  .card:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .card.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .card img {
    width: 72px;
    height: 72px;
    image-rendering: pixelated;
    display: block;
  }

  .card-name {
    font-weight: 600;
  }

  #preview {
    position: relative;
    height: 150px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #previewFrame {
    display: none;
    width: 200px;
    height: 130px;
    border: 0;
    background: transparent;
    /* The sprite page is light-scheme; matching it keeps the frame transparent when this window is dark. */
    color-scheme: light;
    pointer-events: none;
  }

  #previewLabel {
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  #previewHint {
    color: var(--muted);
  }

  #next {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 9px 0;
  }
</style>
</head>
<body>
  <div id="wrap">
    <h1>Chọn người bạn đồng hành của bạn!</h1>

    <div id="cards">
      <div class="card" data-model="clawd">
        <svg width="72" height="72" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
          <g fill="#D87656">
            <rect x="10" y="0" width="60" height="40"/>
            <rect x="-5" y="14" width="15" height="13"/>
            <rect x="70" y="14" width="15" height="13"/>
            <rect x="10" y="40" width="7.5" height="15"/>
            <rect x="25" y="40" width="7.5" height="15"/>
            <rect x="47.5" y="40" width="7.5" height="15"/>
            <rect x="62.5" y="40" width="7.5" height="15"/>
          </g>
          <rect x="17.5" y="6" width="7.5" height="7.5" fill="#000000"/>
          <rect x="55" y="6" width="7.5" height="7.5" fill="#000000"/>
        </svg>
        <div class="card-name">🦀 Clawd</div>
      </div>

      <div class="card" data-model="cat">
        <img src="img/cat.png" alt="Mèo">
        <div class="card-name">🐱 Mèo</div>
      </div>

      <div class="card" data-model="sheep">
        <img src="img/sheep.png" alt="Cừu">
        <div class="card-name">🐑 Cừu</div>
      </div>
    </div>

    <div id="preview">
      <span id="previewLabel"></span>
      <span id="previewHint">Chọn một pet để xem trước</span>
      <iframe id="previewFrame" title="Xem trước" scrolling="no" tabindex="-1"></iframe>
    </div>

    <button id="next" class="btn primary" disabled>Tiếp tục →</button>
  </div>
  <script src="model-picker.js"></script>
</body>
</html>
