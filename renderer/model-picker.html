<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chọn pet</title>
<style>
  html, body {
    margin: 0;
    background: #F2F2F2;
    color: #2B2B2B;
    font-family: "Segoe UI", sans-serif;
    font-size: 13px;
    user-select: none;
  }

  #wrap {
    padding: 22px 20px 18px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 15px;
    margin: 0 0 20px;
    text-align: center;
    font-weight: 700;
  }

  #cards {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .card {
    flex: 1;
    border: 2px solid #2B2B2B;
    background: #FFF;
    padding: 16px 8px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: background 0.08s;
  }

  .card:hover {
    background: #EAEAEA;
  }

  .card.selected {
    background: #2B2B2B;
    color: #F2F2F2;
  }

  .card img {
    width: 72px;
    height: 72px;
    image-rendering: pixelated;
    display: block;
  }

  .card-name {
    font-weight: 700;
    font-size: 13px;
  }

  #next {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: 2px solid #2B2B2B;
    background: #2B2B2B;
    color: #F2F2F2;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 0;
    cursor: pointer;
  }

  #next:disabled {
    background: #CCC;
    border-color: #CCC;
    color: #999;
    cursor: not-allowed;
  }

  #next:not(:disabled):hover {
    background: #444;
  }
</style>
</head>
<body>
  <div id="wrap">
    <h1>Chọn người bạn đồng hành của bạn!</h1>

    <div id="cards">
      <div class="card" data-model="clawd">
        <svg width="72" height="72" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
          <g fill="#D87656">
            <rect x="10" y="0" width="60" height="40"/>
            <rect x="-5" y="14" width="15" height="13"/>
            <rect x="70" y="14" width="15" height="13"/>
            <rect x="10" y="40" width="7.5" height="15"/>
            <rect x="25" y="40" width="7.5" height="15"/>
            <rect x="47.5" y="40" width="7.5" height="15"/>
            <rect x="62.5" y="40" width="7.5" height="15"/>
          </g>
          <rect x="17.5" y="6" width="7.5" height="7.5" fill="#000000"/>
          <rect x="55" y="6" width="7.5" height="7.5" fill="#000000"/>
        </svg>
        <div class="card-name">🦀 Clawd</div>
      </div>

      <div class="card" data-model="cat">
        <img src="img/cat.png" alt="Mèo">
        <div class="card-name">🐱 Mèo</div>
      </div>

      <div class="card" data-model="sheep">
        <img src="img/sheep.png" alt="Cừu">
        <div class="card-name">🐑 Cừu</div>
      </div>
    </div>

    <button id="next" disabled>Tiếp tục →</button>
  </div>
  <script src="model-picker.js"></script>
</body>
</html>
