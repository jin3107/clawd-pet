<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Clawd Pet</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/states.css">
<link rel="stylesheet" href="css/keyframes.css">
<style>
  html, body { touch-action: none; width: 100%; height: 100%; margin: 0; }
  #stage { position: relative; width: 100%; height: 100%; display: block; }
  #pet-root { position: absolute; left: 0; top: 0; width: 100px; height: 65px; }
  #bubble-wrap {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    margin-bottom: 4px;
    pointer-events: none;
  }
  #bubble-wrap.show { display: flex; }
  #bubble-text {
    box-sizing: border-box;
    max-width: 200px;
    padding: 8px 10px;
    background: #F2F2F2;
    border: 2px solid #2B2B2B;
    color: #2B2B2B;
    font-family: "Segoe UI", sans-serif;
    font-size: 12px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  #bubble-tail {
    width: 8px;
    height: 8px;
    margin: -2px auto 0;
    background: #F2F2F2;
    border: 2px solid #2B2B2B;
    border-top: none;
  }
</style>
</head>
